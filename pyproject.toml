[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hashhedge-quant"
version = "0.1.0"
description = "Мониторинг, бэктест и live-сигналы под правила проп-компании HashHedge"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "numba>=0.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "httpx>=0.27",
    "orjson>=3.10",
    "websockets>=12",
    "redis>=5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "clickhouse-connect>=0.7",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23",
    "aiogram>=3.4",
    "prometheus-client>=0.20",
    "exchange_calendars>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "fakeredis>=2.23"]
llm = ["anthropic>=1.0"]           # опциональное LLM-резюме сетапа (раздел 8.3)

[project.scripts]
quant = "quant.cli:main"

[tool.setuptools.packages.find]
include = ["quant*", "signals*", "api*", "bot*", "collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: тест ходит в публичные API бирж (пропускается без QUANT_NETWORK_TESTS=1)",
    "slow: долгий тест",
]
filterwarnings = ["ignore::DeprecationWarning"]
